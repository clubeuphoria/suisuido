<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メダカの飼い方・水の作り方ガイド | すいすい堂</title>
    <meta name="description" content="大田原市のメダカ専門店「すいすい堂」による、メダカに優しい水の作り方や分かりやすい飼い方ガイド。初心者の方も安心してメダカライフを楽しめます。">

    <style>
        :root {
            --primary: #1B365D; /* 藍色 */
            --accent: #C5A059;  /* 金茶 */
            --bg: #FBF9F5;      /* 和紙風背景 */
            --text: #2D2D2D;
        }

        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        /* 上部固定ナビゲーション */
        nav.site-nav {
            background-color: #ffffff;
            border-bottom: 1px solid #eae6df;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .nav-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            text-decoration: none;
        }

        .nav-logo-text {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        .nav-links li a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links li a:hover {
            color: var(--accent);
        }

        /* ヘッダー */
        header.sub-header {
            background: linear-gradient(135deg, #1B365D, #0F203C);
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            border-bottom: 5px solid var(--accent);
        }

        header.sub-header h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            letter-spacing: 0.1em;
        }

        header.sub-header p {
            font-size: 1.05rem;
            color: var(--accent);
            margin: 0;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: #ffffff;
            margin-bottom: 40px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #eae6df;
        }

        h2 {
            font-size: 1.6rem;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
        }

        /* 画像を綺麗に表示するスタイル */
        .image-container {
            text-align: center;
            margin: 20px 0 30px 0;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #eae6df;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        p {
            font-size: 1.05rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .back-link-box {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .back-btn {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 30px;
            font-size: 1rem;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #0F203C;
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 60px;
            letter-spacing: 0.05em;
        }

        @media (max-width: 600px) {
            .nav-links { gap: 10px; font-size: 0.8rem; }
            header.sub-header h1 { font-size: 1.6rem; }
            section { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <!-- 上部固定のナビゲーションメニュー -->
    <nav class="site-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span class="nav-logo-text">すいすい堂</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#about">お店の紹介</a></li>
                <li><a href="index.html#varieties">取扱品種</a></li>
                <li><a href="index.html#access">営業案内</a></li>
                <li><a href="tips.html">めだかすくいのコツ</a></li>
                <li><a href="care.html" style="color: var(--accent); font-weight: bold;">飼い方・水作り</a></li>
                <li><a href="index.html#contact">お問い合わせ</a></li>
            </ul>
        </div>
    </nav>

    <!-- ヘッダー -->
    <header class="sub-header">
        <h1>メダカの飼い方・水の作り方</h1>
        <p>スイちゃんと一緒に楽しくメダカを育てよう！</p>
    </header>

    <main>
        <!-- 水の作り方セクション -->
        <section>
            <h2>メダカに使う「水の作り方」</h2>
            <p>水道水をペットボトルに入れて外に置いて3日ほどおくだけ！メダカにやさしい水の作り方を詳しく解説しています。</p>
            
            <div class="image-container">
                <!-- ※画像ファイル名が異なる場合は src="実際のファイル名.jpg" に書き換えてください -->
                <img src="water_guide.jpg" alt="メダカに使う水の作り方ガイド">
            </div>
        </section>

        <!-- メダカの飼い方セクション -->
        <section>
            <h2>メダカの「飼い方ガイド」</h2>
            <p>容器の選び方、置き場所、水換えや季節ごとの管理のポイントなど、やさしく・かんたん・楽しく育てるためのコツが詰まっています。</p>
            
            <div class="image-container">
                <img src="care_guide.jpg" alt="メダカの飼い方ガイド">
            </div>

            <div class="back-link-box">
                <a href="index.html" class="back-btn">トップページに戻る</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; すいすい堂 All Rights Reserved.</p>
    </footer>

</body>
</html>
